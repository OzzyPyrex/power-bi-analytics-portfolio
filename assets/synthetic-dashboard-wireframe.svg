<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic operations dashboard wireframe</title>
  <desc id="desc">A fictional, neutral dashboard layout with four KPI cards, a trend chart, a backlog chart, and filters.</desc>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <rect width="1200" height="82" fill="#17324d"/>
  <text x="42" y="50" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Synthetic Operations Overview</text>
  <text x="42" y="71" fill="#c8d9e8" font-family="Arial, sans-serif" font-size="13">Fictional data for portfolio demonstration only</text>
  <g font-family="Arial, sans-serif">
    <g fill="#ffffff" stroke="#d8e1ea">
      <rect x="42" y="112" width="246" height="112" rx="10"/>
      <rect x="314" y="112" width="246" height="112" rx="10"/>
      <rect x="586" y="112" width="246" height="112" rx="10"/>
      <rect x="858" y="112" width="246" height="112" rx="10"/>
      <rect x="42" y="254" width="724" height="288" rx="10"/>
      <rect x="792" y="254" width="312" height="288" rx="10"/>
      <rect x="42" y="570" width="1062" height="102" rx="10"/>
    </g>
    <g fill="#536475" font-size="14" font-weight="700">
      <text x="64" y="143">NEW CASES</text><text x="336" y="143">COMPLETED CASES</text><text x="608" y="143">OPEN BACKLOG</text><text x="880" y="143">ON-TIME RATE</text>
      <text x="64" y="284">Monthly demand and completion</text><text x="814" y="284">Backlog by region</text><text x="64" y="601">Filters: Month · Region · Service line</text>
    </g>
    <g fill="#17324d" font-size="34" font-weight="700">
      <text x="64" y="194">—</text><text x="336" y="194">—</text><text x="608" y="194">—</text><text x="880" y="194">—</text>
    </g>
    <g stroke="#a6b9ca" stroke-width="2" fill="none">
      <path d="M75 500 L190 430 L306 452 L422 372 L538 410 L654 334 L730 357"/>
      <path d="M75 515 L190 480 L306 414 L422 439 L538 386 L654 395 L730 346" stroke="#33a474"/>
      <line x1="838" y1="498" x2="838" y2="320"/><line x1="838" y1="498" x2="1060" y2="498"/>
    </g>
    <g fill="#6195c6"><rect x="870" y="385" width="42" height="113"/><rect x="940" y="347" width="42" height="151"/></g>
    <g fill="#33a474"><rect x="1010" y="413" width="42" height="85"/></g>
    <g fill="#6a7c8e" font-size="12"><text x="78" y="532">Jan</text><text x="235" y="532">Feb</text><text x="392" y="532">Mar</text><text x="885" y="521">North</text><text x="951" y="521">South</text><text x="1014" y="521">West</text></g>
  </g>
</svg>
